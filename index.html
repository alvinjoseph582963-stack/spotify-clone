<!Doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-mobile">
        <div class="spotify-logo">
          <img src="images/spotify-logo-mobile.svg" alt="Spotify-logo" />
        </div>
        <div class="top-bar-button-container">
          <button class="open-button">Open App</button>
          <div class="hamburger">
            <img src="images/three-line-mobile.svg" alt="hamburger" />
          </div>
        </div>
      </div>
      <div class="header-desktop">
        <div class="spotify-header-icon">
          <img src="images/desktop-logo.svg" alt="spotify-header-icon" />
        </div>
        <div class="nav-bar-container">
          <div class="home-search-bar">
            <button class="home-button">
              <img src="images/home.svg" alt="home-img" />
            </button>
            <div class="search-button-icon">
              <img src="images/search.svg" alt="search-img" class="search-button-icon-img" />
              <div class="desktop-input-box">
                <input type="searchbar" placeholder="What do you want to play?" />
                <div class="spotify-search-bar-icon">
                  <img src="images/spotify-search-bar-icon.svg" alt="spotify search bar icon" />
                </div>
              </div>
            </div>
          </div>
          <div class="nav-bar-buttons-container">
            <button class="premium-button">Premium</button>
            <button class="premium-button">Support</button>
            <button class="premium-button download-button">Download</button>
            <button class="install-button">
              <img src="images/install-button.svg" alt="install-logo" />
              <span class="install-span"> Install App</span>
            </button>
          </div>
          <div class="sign-login-buttons-container">
            <button class="signup-button">Sign up</button>
            <button class="login-button">Log in</button>
          </div>
        </div>
      </div>
    </header>
    <div class="content-wrapper">
      <div class="songs-container">
        <h2 class="songs-heading">Trending songs</h2>
        <div class="song-card-container">
          <div class="song-card-img">
            <img src="https://i.scdn.co/image/ab67616d00001e022ae90d5fdaf46b068e450c9a" alt="song-thumbnail" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
